<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" role="img" aria-labelledby="lt ld">
  <title id="lt">Aranda Electrics</title>
  <desc id="ld">Metallic silver monogram AE with lightning motif on dark background.</desc>
  <defs>
    <!-- Plata pulida: banda diagonal clara → oscura → clara -->
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F5F5F5"/>
      <stop offset="20%"  stop-color="#C8C8C8"/>
      <stop offset="45%"  stop-color="#7A7A7A"/>
      <stop offset="55%"  stop-color="#5A5A5A"/>
      <stop offset="75%"  stop-color="#B0B0B0"/>
      <stop offset="100%" stop-color="#EAEAEA"/>
    </linearGradient>
    <!-- Reflejo cruzado (bisel 3D) -->
    <linearGradient id="silverHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset="45%"  stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".45"/>
    </linearGradient>
  </defs>
  <!-- ===== MONOGRAMA AE ===== -->
  <g transform="translate(20 8)">
    <!-- A: pata izquierda extendida en rayo, pata derecha vertical corta, sin travesaño -->
    <path d="M 20 60
             L 34 10
             L 44 10
             L 58 60
             L 46 60
             L 40 36
             L 24 36
             Z"
          fill="url(#silver)"/>
    <!-- corte/rayo interior de la A para reforzar la sensación de chispa -->
    <path d="M 30 46 L 40 20 L 38 34 L 46 34 L 34 62 Z"
          fill="#0D0D0D" opacity=".85"/>
    <!-- E fusionada: trazo superior en zigzag + trazo inferior en punta de flecha -->
    <path d="M 66 10
             L 108 10
             L 100 20
             L 78 20
             L 80 30
             L 104 30
             L 96 40
             L 78 40
             L 80 50
             L 108 50
             L 128 50
             L 118 60
             L 66 60
             Z"
          fill="url(#silver)"/>
    <!-- Bisel cruzado para dar volumen -->
    <path d="M 20 60 L 34 10 L 44 10 L 58 60 L 46 60 L 40 36 L 24 36 Z"
          fill="url(#silverHi)"/>
    <path d="M 66 10 L 108 10 L 100 20 L 78 20 L 80 30 L 104 30 L 96 40 L 78 40 L 80 50 L 108 50 L 128 50 L 118 60 L 66 60 Z"
          fill="url(#silverHi)"/>
  </g>
  <!-- ===== WORDMARK ===== -->
  <g fill="url(#silver)">
    <!-- ARANDA con A sin travesaño -->
    <text x="120" y="92"
          font-family="system-ui,Segoe UI,Arial,sans-serif"
          font-weight="800"
          font-size="22"
          text-anchor="middle"
          letter-spacing="6">ΛRΛNDΛ</text>
    <!-- Triángulos laterales + ELECTRICS -->
    <g transform="translate(0 -0.5)">
      <path d="M 40 108 L 46 108 L 43 102 Z"/>
      <path d="M 194 108 L 200 108 L 197 102 Z"/>
    </g>
    <text x="120" y="114"
          font-family="system-ui,Segoe UI,Arial,sans-serif"
          font-weight="600"
          font-size="10"
          text-anchor="middle"
          letter-spacing="7">ELECTRICS</text>
  </g>
</svg>
